name: Vaidya AI synthetic demo quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py vaidya scripts tests
      - name: Execute domain and Flask end-to-end integration tests
        env:
          APP_ENV: development
          LLM_PROVIDER: demo
        run: python -m pytest -v tests
