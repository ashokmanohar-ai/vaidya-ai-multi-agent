name: Production engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements-production.txt
          python -m pip install pytest ruff pip-audit
      - name: Unit/API/integration tests without live cloud secrets
        run: python -m pytest -q production_tests tests
      - name: Python compile
        run: python -m compileall -q production production_app.py vaidya
      - name: Ruff critical rules
        run: ruff check production --select E9,F63,F7,F82
      - name: Dependency security report
        run: pip-audit --strict
